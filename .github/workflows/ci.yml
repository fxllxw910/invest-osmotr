name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Тесты адресов и геоконтроля
        run: node test/address.js
      - name: Тесты SMS-шлюзов
        run: node test/sms.js
      - name: Сквозные тесты интерфейса
        run: node test/run.js
      - name: Аудит CSS
        run: node test/css-audit.js
